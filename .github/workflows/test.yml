name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python unit tests
        run: python -m unittest discover
        env:
          PYTHONPATH: src
      - name: Python compile check
        run: python -m compileall src tests
      - name: VS Code extension tests
        run: npm --prefix extensions/vscode test

  android-fixture-cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify mechanically derived fixture
        working-directory: apps/android
        run: python3 tools/check_fixture_drift.py --check
      - name: Verify Android privacy boundary
        working-directory: apps/android
        run: python3 tools/privacy_negative_check.py
      - name: Build and test fixture cockpit
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin --console=plain
